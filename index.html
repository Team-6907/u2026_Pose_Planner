<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GOATLIB - Pose Planner</title>
    <link rel="icon" type="image/png" href="assets/frc2026logo.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header>
        <div class="header-left">
          <div class="logo">
            <span class="logo-icon">🐐</span>
            <span class="logo-text">GOATLIB</span>
          </div>
          <span class="app-name">Pose Planner</span>
        </div>
        <div class="header-right">
          <span id="coordinates" class="coordinates"></span>
          <button id="configBtn" class="btn btn-tool" title="Robot Config">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
              <path d="M8 4.754a3.246 3.246 0 1 0 0 6.492 3.246 3.246 0 0 0 0-6.492zM5.754 8a2.246 2.246 0 1 1 4.492 0 2.246 2.246 0 0 1-4.492 0z"/>
              <path d="M9.796 1.343c-.527-1.79-3.065-1.79-3.592 0l-.094.319a.873.873 0 0 1-1.255.52l-.292-.16c-1.64-.892-3.433.902-2.54 2.541l.159.292a.873.873 0 0 1-.52 1.255l-.319.094c-1.79.527-1.79 3.065 0 3.592l.319.094a.873.873 0 0 1 .52 1.255l-.16.292c-.892 1.64.901 3.434 2.541 2.54l.292-.159a.873.873 0 0 1 1.255.52l.094.319c.527 1.79 3.065 1.79 3.592 0l.094-.319a.873.873 0 0 1 1.255-.52l.292.16c1.64.893 3.434-.902 2.54-2.541l-.159-.292a.873.873 0 0 1 .52-1.255l.319-.094c1.79-.527 1.79-3.065 0-3.592l-.319-.094a.873.873 0 0 1-.52-1.255l.16-.292c.893-1.64-.902-3.433-2.541-2.54l-.292.159a.873.873 0 0 1-1.255-.52l-.094-.319zm-2.633.283c.246-.835 1.428-.835 1.674 0l.094.319a1.873 1.873 0 0 0 2.693 1.115l.291-.16c.764-.415 1.6.42 1.184 1.185l-.159.292a1.873 1.873 0 0 0 1.116 2.692l.318.094c.835.246.835 1.428 0 1.674l-.319.094a1.873 1.873 0 0 0-1.115 2.693l.16.291c.415.764-.42 1.6-1.185 1.184l-.291-.159a1.873 1.873 0 0 0-2.693 1.116l-.094.318c-.246.835-1.428.835-1.674 0l-.094-.319a1.873 1.873 0 0 0-2.692-1.115l-.292.16c-.764.415-1.6-.42-1.184-1.185l.159-.291A1.873 1.873 0 0 0 1.945 8.93l-.319-.094c-.835-.246-.835-1.428 0-1.674l.319-.094A1.873 1.873 0 0 0 3.06 4.377l-.16-.292c-.415-.764.42-1.6 1.185-1.184l.292.159a1.873 1.873 0 0 0 2.692-1.115l.094-.319z"/>
            </svg>
          </button>
        </div>
      </header>

      <div class="main">
        <aside class="sidebar">
          <section class="panel">
            <div class="panel-header">
              <span class="panel-title">Poses</span>
              <span class="badge" id="poseCount">0</span>
            </div>
            <div class="group-filter">
              <div class="group-filter-header">
                <span class="panel-subtitle">Groups</span>
                <button id="addGroup" class="btn btn-small" type="button">Add Group</button>
              </div>
              <div id="groupFilters" class="group-chips"></div>
            </div>
            <ul id="poseList" class="pose-list"></ul>
            <div class="button-row">
              <button id="addPose" class="btn btn-primary">
                <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
                  <path d="M8 2a.5.5 0 0 1 .5.5v5h5a.5.5 0 0 1 0 1h-5v5a.5.5 0 0 1-1 0v-5h-5a.5.5 0 0 1 0-1h5v-5A.5.5 0 0 1 8 2z"/>
                </svg>
                Add Pose
              </button>
              <button id="deletePose" class="btn btn-ghost" disabled>
                <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
                  <path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0V6z"/>
                  <path fill-rule="evenodd" d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1v1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4H4.118zM2.5 3V2h11v1h-11z"/>
                </svg>
              </button>
            </div>
          </section>

          <section class="panel" id="editPanel">
            <div class="panel-title">Edit Pose</div>
            <div class="form-group">
              <label for="poseGroup">Group</label>
              <select id="poseGroup" disabled></select>
            </div>
            <div class="form-group">
              <label for="poseName">Name</label>
              <input id="poseName" type="text" placeholder="Enter pose name" disabled />
            </div>

            <div class="slider-group">
              <div class="slider-header">
                <label>X Position</label>
                <input type="number" class="slider-input" id="poseXInput" step="0.01" disabled />
              </div>
              <input id="poseX" type="range" min="0" max="16.54" step="0.01" value="0" disabled />
            </div>

            <div class="slider-group">
              <div class="slider-header">
                <label>Y Position</label>
                <input type="number" class="slider-input" id="poseYInput" step="0.01" disabled />
              </div>
              <input id="poseY" type="range" min="0" max="8.07" step="0.01" value="0" disabled />
            </div>

            <div class="slider-group">
              <div class="slider-header">
                <label>Rotation</label>
                <input type="number" class="slider-input" id="poseThetaInput" step="1" disabled />
              </div>
              <input id="poseTheta" type="range" min="-180" max="180" step="1" value="0" disabled />
            </div>
          </section>

          <section class="panel">
            <div class="panel-title">File</div>
            <div class="file-actions">
              <button id="pasteJson" class="btn btn-secondary">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                  <path d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1h1a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h1v-1z"/>
                  <path d="M9.5 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5h3zm-3-1A1.5 1.5 0 0 0 5 1.5v1A1.5 1.5 0 0 0 6.5 4h3A1.5 1.5 0 0 0 11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3z"/>
                </svg>
                Paste JSON
              </button>
              <button id="uploadJson" class="btn btn-secondary">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                  <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/>
                  <path d="M7.646 1.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1-.708.708L8.5 2.707V11.5a.5.5 0 0 1-1 0V2.707L5.354 4.854a.5.5 0 1 1-.708-.708l3-3z"/>
                </svg>
                Upload File
              </button>
              <input type="file" id="fileInput" accept=".json" style="display: none;" />
              <button id="copyJson" class="btn btn-primary btn-copy">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                  <path d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1h1a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h1v-1z"/>
                  <path d="M9.5 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5h3zm-3-1A1.5 1.5 0 0 0 5 1.5v1A1.5 1.5 0 0 0 6.5 4h3A1.5 1.5 0 0 0 11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3z"/>
                </svg>
                Copy JSON
              </button>
              <button id="clearAll" class="btn btn-ghost">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                  <path d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8 2.146 2.854Z"/>
                </svg>
                Clear All
              </button>
            </div>
            <div id="status" class="status"></div>
          </section>

        </aside>

        <main class="canvas-area">
          <div class="toolbar">
            <div class="toolbar-group">
              <button id="resetView" class="btn btn-tool" title="Reset View (R)">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                  <path d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2v1z"/>
                  <path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466z"/>
                </svg>
              </button>
            </div>
          </div>
          <div class="canvas-container">
            <canvas id="fieldCanvas"></canvas>
          </div>
        </main>
      </div>
    </div>

    <!-- Robot Config Modal -->
    <div id="configModal" class="modal hidden">
      <div class="modal-backdrop"></div>
      <div class="modal-content">
        <div class="modal-header">
          <span class="modal-title">Robot Config</span>
          <button id="configClose" class="btn btn-icon" type="button">&times;</button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label for="robotLength">Length (front-back, mm)</label>
            <input id="robotLength" type="number" min="100" max="2000" step="1" value="618" />
          </div>
          <div class="form-group">
            <label for="robotWidth">Width (side-to-side, mm)</label>
            <input id="robotWidth" type="number" min="100" max="2000" step="1" value="766" />
          </div>
        </div>
        <div class="modal-footer">
          <button id="configSave" class="btn btn-primary">Save</button>
        </div>
      </div>
    </div>

    <!-- Group Context Menu -->
    <div id="groupContextMenu" class="context-menu hidden">
      <button type="button" data-action="rename">Rename</button>
      <button type="button" data-action="delete" class="danger">Delete</button>
    </div>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
